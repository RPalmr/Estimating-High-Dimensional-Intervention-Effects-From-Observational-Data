[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "observational-ida"
version = "0.1.0"
description = "Gaussian intervention effects from observational data, Maathuis et al. (2009)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "numba>=0.61,<1"]

[project.optional-dependencies]
experiments = ["matplotlib>=3.9,<4", "scikit-learn>=1.5,<2"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/ida"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["numba", "numba.*"]
follow_imports = "skip"

